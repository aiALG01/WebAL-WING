<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../base.css">
<style>
  body { background: var(--navy); }
  .photo {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1350px;
    object-fit: cover;
    object-position: 50% 18%;
  }
  .veil {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(7,39,104,0) 0%,
      rgba(7,39,104,0) 44%,
      rgba(7,39,104,0.6) 68%,
      rgba(7,39,104,0.94) 100%);
  }
  .cta {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 100px;
    color: var(--cream);
  }
  .headline { font-size: 72px; margin-bottom: 30px; }
  .headline .accent {
    font-family: 'Britney', serif;
    color: var(--tan);
    font-weight: 500;
  }
  .body-text { font-size: 34px; color: var(--cream); opacity: 0.9; max-width: 820px; }
</style>
</head>
<body>
  <div class="frame">
    <img class="photo" src="../images/Lena-27.jpg">
    <div class="veil"></div>
    <div class="cta">
      <div class="headline">Lernen wir uns <span class="accent">kennen</span>.</div>
      <div class="body-text">Schreiben Sie mir per DM. Ich antworte pers&ouml;nlich.</div>
    </div>
  </div>
</body>
</html>
