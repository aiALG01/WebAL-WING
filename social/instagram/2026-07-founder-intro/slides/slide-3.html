<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../base.css">
<style>
  body { background: #000; }
  .bleed-window { position: absolute; inset: 0; overflow: hidden; }
  .bleed-img {
    position: absolute;
    top: -45px;
    left: -1080px;
    width: 2160px;
    height: 1440px;
  }
  .veil-bottom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 640px;
    background: linear-gradient(0deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0) 100%);
  }
  .caption {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 96px;
    color: var(--cream);
  }
  .caption .headline { font-size: 58px; margin-bottom: 22px; }
  .caption .body-text { font-size: 30px; color: var(--cream); opacity: 0.92; max-width: 880px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="bleed-window">
      <img class="bleed-img" src="../images/Lena-67.jpg">
    </div>
    <div class="veil-bottom"></div>
    <div class="caption">
      <div class="headline">Gr&uuml;nderin von AL&#8209;WING.</div>
      <div class="body-text">Master in Wirtschaftsinformatik &ndash; meine Leidenschaft ist es, Design, Technologie und moderne Webl&ouml;sungen zu verbinden.</div>
    </div>
  </div>
</body>
</html>
