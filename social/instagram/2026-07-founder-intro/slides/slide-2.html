<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../base.css">
<style>
  body { background: var(--navy); }
  .bleed-window { position: absolute; inset: 0; overflow: hidden; background: #050b1a; }
  .bleed-img {
    position: absolute;
    top: -45px;
    left: -160px;
    width: 2160px;
    height: 1440px;
    transform: scaleX(-1);
  }
  .navy-tint {
    position: absolute;
    inset: 0;
    background: var(--navy);
    mix-blend-mode: screen;
    opacity: 0.6;
  }
  .veil-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 560px;
    background: linear-gradient(180deg, rgba(4,12,32,0.7) 0%, rgba(4,12,32,0) 100%);
  }
  .caption {
    position: absolute;
    top: 160px;
    left: 72px;
    right: 72px;
    color: var(--cream);
  }
  .caption .headline { font-size: 62px; margin-bottom: 26px; }
  .caption .body-text { font-size: 28px; color: var(--cream); opacity: 0.9; max-width: 620px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="bleed-window">
      <img class="bleed-img" src="../images/Lena-67.jpg">
      <div class="navy-tint"></div>
    </div>
    <div class="veil-top"></div>
    <div class="caption">
      <div class="headline">Ich bin<br>Anna&nbsp;Lena&nbsp;Gerth.</div>
      <div class="body-text">Master of Science Wirtschaftsinformatik, Schwerpunkt E&#8209;Commerce.</div>
    </div>
  </div>
</body>
</html>
