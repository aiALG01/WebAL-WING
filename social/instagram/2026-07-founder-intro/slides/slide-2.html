<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../base.css">
<style>
  body { background: #000; }
  .bleed-window { position: absolute; inset: 0; overflow: hidden; }
  .bleed-img {
    position: absolute;
    top: -45px;
    left: 0;
    width: 2160px;
    height: 1440px;
  }
  .veil-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 520px;
    background: linear-gradient(180deg, rgba(7,39,104,0.55) 0%, rgba(7,39,104,0) 100%);
  }
  .caption {
    position: absolute;
    top: 88px;
    left: 72px;
    right: 72px;
    color: var(--cream);
  }
  .caption .headline { font-size: 66px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="bleed-window">
      <img class="bleed-img" src="../images/Lena-67.jpg">
    </div>
    <div class="veil-top"></div>
    <div class="caption">
      <div class="headline">Ich bin<br>Anna&nbsp;Lena&nbsp;Gerth.</div>
    </div>
  </div>
</body>
</html>
