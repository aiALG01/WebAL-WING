<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../base.css">
<style>
  body { background: var(--navy); }
  .content {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 50%;
    transform: translateY(-50%);
  }
  .kicker {
    font-family: 'Britney', serif;
    font-size: 42px;
    color: var(--tan);
    margin-bottom: 28px;
  }
  .rule {
    width: 64px;
    height: 2px;
    background: var(--tan);
    margin-bottom: 40px;
  }
  .headline {
    font-size: 72px;
    color: var(--cream);
    margin-bottom: 40px;
  }
  .headline .accent {
    font-family: 'Britney', serif;
    color: var(--tan);
    font-weight: 500;
  }
  .body-text {
    font-size: 34px;
    color: var(--cream);
    opacity: 0.85;
    max-width: 820px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="content">
      <div class="rule"></div>
      <div class="kicker">Meine Geschichte</div>
      <div class="headline">Warum ich AL&#8209;WING <span class="accent">gegr&uuml;ndet</span> habe.</div>
      <div class="body-text">Damit kleine Betriebe online genauso professionell wirken wie ihre Arbeit vor Ort.</div>
    </div>
  </div>
</body>
</html>
