<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Visitenkarte — AL-WING</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* Schriften — lokal, identisch zur Haupt-Website (css/style.css) */
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400 600;
    src: url("../assets/fonts/inter-400-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400 600;
    src: url("../assets/fonts/inter-400-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Melodrama";
    font-style: normal;
    font-weight: 300 700;
    src: url("../assets/fonts/melodrama-variable.woff2") format("woff2");
  }

  :root {
    --color-navy: #072768;
    --color-steel-blue: #5079B2;
    --color-cream: #F4EAE1;
    --color-tan: #9D785D;
    --color-brown: #936A4D;
    --font-display: "Melodrama", "Cormorant Garamond", Georgia, serif;
    --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;

    /* Standard-EU-Visitenkarte 85 x 55 mm, plus 3 mm Beschnittzugabe je Seite */
    --trim-w: 85mm;
    --trim-h: 55mm;
    --bleed: 3mm;
    --card-w: calc(var(--trim-w) + 2 * var(--bleed));
    --card-h: calc(var(--trim-h) + 2 * var(--bleed));
    --safe: 8mm; /* Sicherheitsabstand für Text ab Anschnittkante */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #cfcfcf;
    font-family: var(--font-body);
  }

  /* Bildschirm-Vorschau: beide Seiten nebeneinander, mit Beschnittkennzeichnung */
  .preview {
    display: flex;
    flex-wrap: wrap;
    gap: 12mm;
    padding: 16mm;
    align-items: flex-start;
  }

  .card-wrap {
    position: relative;
  }

  .card-label {
    font-family: var(--font-body);
    font-size: 3.2mm;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #4a4a4a;
    margin-bottom: 3mm;
  }

  .card {
    width: var(--card-w);
    height: var(--card-h);
    position: relative;
    overflow: hidden;
    box-shadow: 0 2mm 6mm rgba(0,0,0,0.18);
  }

  /* gestrichelte Trimlinie nur als Bildschirm-Hilfslinie, nicht im Druckexport der Einzelseiten sichtbar */
  .trim-guide {
    position: absolute;
    inset: var(--bleed);
    border: 0.25mm dashed rgba(0,0,0,0.25);
    pointer-events: none;
  }
  .card--front .trim-guide { border-color: rgba(244,234,225,0.35); }

  /* ---------- Vorderseite ---------- */
  .card--front {
    background: var(--color-navy);
    color: var(--color-cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .front-content {
    position: relative;
    z-index: 1;
    padding: 0 var(--safe);
  }

  .front-wordmark {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 8.6mm;
    letter-spacing: 0.08em;
    color: var(--color-cream);
    line-height: 1;
    white-space: nowrap;
  }
  .front-wordmark .dot { color: var(--color-tan); }

  .front-rule {
    width: 14mm;
    height: 0.35mm;
    background: var(--color-tan);
    margin: 3.6mm auto;
  }

  .front-tagline {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 2.5mm;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--color-cream) 78%, var(--color-steel-blue));
  }

  .front-city {
    position: absolute;
    right: var(--safe);
    bottom: var(--safe);
    font-family: var(--font-body);
    font-size: 2.3mm;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--color-tan);
  }

  /* ---------- Rückseite ---------- */
  .card--back {
    background: var(--color-cream);
    color: var(--color-navy);
  }

  .back-content {
    position: absolute;
    inset: 0;
    padding: var(--safe);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .back-mark {
    width: 9mm;
    height: 9mm;
    background: var(--color-navy);
    color: var(--color-cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 4mm;
    letter-spacing: 0.02em;
  }

  .back-name-block {
    margin-top: auto;
  }

  .back-name {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 5.4mm;
    color: var(--color-navy);
    line-height: 1.15;
  }

  .back-role {
    margin-top: 1.4mm;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 2.4mm;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-brown);
  }

  .back-rule {
    width: 100%;
    height: 0.3mm;
    background: color-mix(in srgb, var(--color-tan) 45%, transparent);
    margin: 3.4mm 0;
  }

  .back-contact {
    font-family: var(--font-body);
    font-size: 2.9mm;
    line-height: 1.65;
    color: var(--color-navy);
  }
  .back-contact .muted {
    color: color-mix(in srgb, var(--color-navy) 62%, var(--color-cream));
  }

  /* ---------- Druck ---------- */
  @media print {
    html, body { background: #fff; }
    .preview {
      display: block;
      padding: 0;
      gap: 0;
    }
    .card-wrap {
      page-break-after: always;
    }
    .card-wrap:last-child { page-break-after: auto; }
    .card-label { display: none; }
    .trim-guide { display: none; }
    .card { box-shadow: none; }
    @page {
      size: var(--card-w) var(--card-h);
      margin: 0;
    }
  }
</style>
</head>
<body>

  <div class="preview">
    <div class="card-wrap">
      <p class="card-label">Vorderseite</p>
      <div class="card card--front" id="front">
        <div class="trim-guide"></div>
        <div class="front-content">
          <div class="front-wordmark">AL-WING<span class="dot">.</span></div>
          <div class="front-rule"></div>
          <div class="front-tagline">Websites · Hosting · Datenschutz</div>
        </div>
        <div class="front-city">Gera</div>
      </div>
    </div>

    <div class="card-wrap">
      <p class="card-label">Rückseite</p>
      <div class="card card--back" id="back">
        <div class="trim-guide"></div>
        <div class="back-content">
          <div class="back-mark">AL.</div>

          <div class="back-name-block">
            <div class="back-name">Anna Lena Gerth</div>
            <div class="back-role">Gründerin, AL-WING</div>
            <div class="back-rule"></div>
            <div class="back-contact">
              +49 1520 2758286<br>
              anlegerth@gmail.com<br>
              <span class="muted">Gera, Deutschland</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
